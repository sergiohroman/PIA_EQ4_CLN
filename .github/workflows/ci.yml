name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Pruebas unitarias + integración (cobertura >= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ejecutar pruebas (falla si la cobertura es < 80%)
        run: pytest
      - name: Exportar contrato OpenAPI
        run: python scripts/exportar_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: |
            coverage.xml
            docs/api/openapi.json

  docker:
    name: Docker Compose (DB + App + Tests)
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Preparar variables de entorno
        run: cp .env.example .env
      - name: Pruebas contra PostgreSQL en contenedores
        run: docker compose --profile test run --rm --build tests
      - name: Arrancar la app y verificar /health
        run: |
          docker compose up -d --build app
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Apagar
        if: always()
        run: docker compose down -v
